server:
  port: 8083

spring:
  application:
    name: payment-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/paymentdb}
    username: ${DB_USER:payment}
    password: ${DB_PASSWORD:payment}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ecom.events
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.ecom.events.InventoryReservedEvent

payment:
  # Orders with amount > this threshold are simulated as failed payments.
  fail-above-amount: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ecom: INFO
    org.apache.kafka: WARN
